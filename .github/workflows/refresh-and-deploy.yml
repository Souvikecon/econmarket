name: Test and refresh data

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: python scripts/update_data.py
        if: github.event_name != 'push'
      - run: python scripts/update_placements.py
        if: github.event_name != 'push'
      - run: python scripts/update_candidate_details.py
        if: github.event_name != 'push'
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet data/candidates.json data/placements.json data/candidate_details.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/candidates.json data/placements.json data/candidate_details.json
            git commit -m "Refresh candidate, placement, and detail data"
            git push
          fi
